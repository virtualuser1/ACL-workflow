<!doctype html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACL USER Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
@keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#2563eb;--primary-dark:#1d4ed8;--success:#059669;--success-light:#d1fae5;
  --warning:#d97706;--warning-light:#fef3c7;--danger:#dc2626;--danger-light:#fee2e2;
  --purple:#7c3aed;--purple-light:#ede9fe;--gray-50:#f8fafc;--gray-100:#f1f5f9;
  --gray-200:#e2e8f0;--gray-300:#cbd5e1;--gray-400:#94a3b8;--gray-500:#64748b;
  --gray-600:#475569;--gray-700:#334155;--gray-800:#1e293b;--gray-900:#0f172a;
  --shadow-sm:0 1px 2px 0 rgb(0 0 0/0.05);--shadow:0 1px 3px 0 rgb(0 0 0/0.1),0 1px 2px -1px rgb(0 0 0/0.1);
  --shadow-md:0 4px 6px -1px rgb(0 0 0/0.1),0 2px 4px -2px rgb(0 0 0/0.1);
  --shadow-xl:0 20px 25px -5px rgb(0 0 0/0.1),0 8px 10px -6px rgb(0 0 0/0.1);
  --radius:10px;--radius-lg:14px;
}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--gray-50);color:var(--gray-800);line-height:1.5;min-height:100vh;font-size:15px}
.wrap{max-width:1280px;margin:0 auto;padding:20px}
.hidden{display:none!important}
.card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:24px;margin-bottom:20px;box-shadow:var(--shadow-sm)}
.card-no-pad{padding:0}
.login{max-width:460px;margin:80px auto;text-align:center;padding:48px}
.login h1{font-size:30px;font-weight:800;color:var(--gray-900);margin-bottom:6px}
.login p{color:var(--gray-500);font-size:15px;margin-bottom:28px}
.login .field{text-align:left;margin-bottom:16px}
.login label{display:block;font-size:13px;font-weight:700;color:var(--gray-600);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.login input{width:100%;padding:13px 16px;border:1px solid var(--gray-300);border-radius:var(--radius);font-size:15px;transition:border-color .2s,box-shadow .2s;font-family:inherit}
.login input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.login button{width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius);font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;margin-top:8px;font-family:inherit}
.login button:hover{background:var(--primary-dark);transform:translateY(-1px);box-shadow:var(--shadow)}
.login button:disabled{opacity:.6;cursor:not-allowed;transform:none}
.message{font-size:14px;padding:10px 14px;border-radius:var(--radius);margin-top:12px;display:none}
.message.show{display:block}
.message.error{background:var(--danger-light);color:var(--danger)}
.message.info{background:var(--gray-100);color:var(--gray-600)}
h1,h2,h3{color:var(--gray-900)}
h2{font-size:20px;font-weight:700;margin-bottom:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.header-title h1{font-size:24px;font-weight:800;margin-bottom:2px}
.header-sub{font-size:13px;color:var(--gray-500)}
.operator-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;background:var(--success-light);color:var(--success);border-radius:20px;font-size:13px;font-weight:600}
.operator-badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--success);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 20px;border:none;border-radius:var(--radius);font-weight:700;cursor:pointer;transition:all .2s;font-size:14px;font-family:inherit}
button:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
button:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{background:#047857}
.btn-warning{background:var(--warning);color:#fff}.btn-warning:hover{background:#b45309}
.btn-purple{background:var(--purple);color:#fff}.btn-purple:hover{background:#6d28d9}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-sm{padding:8px 16px;font-size:13px}
.btn-outline{background:transparent;border:1px solid var(--gray-300);color:var(--gray-700)}.btn-outline:hover{background:var(--gray-100)}
.btn-lg{padding:14px 28px;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-sm);transition:transform .2s,box-shadow .2s;display:flex;align-items:center;gap:16px}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat-label{font-size:13px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.stat-value{font-size:34px;font-weight:800;color:var(--gray-900);line-height:1}
.stat-pending .stat-value{color:var(--warning)}
.stat-hold .stat-value{color:var(--purple)}
.stat-done .stat-value{color:var(--success)}
.task-card{background:#fff;border:2px solid var(--gray-200);border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:14px;box-shadow:var(--shadow-sm);transition:all .2s}
.task-card:hover{box-shadow:var(--shadow-md)}
.task-card.urgent-card{border-color:var(--danger);background:linear-gradient(135deg,#fff 0%,#fef2f2 100%)}
.task-card.hold-card{border-color:var(--purple);background:linear-gradient(135deg,#fff 0%,#f5f3ff 100%)}
.task-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.task-id{font-size:18px;font-weight:800;color:var(--gray-800)}
.task-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.meta-item{background:var(--gray-50);padding:12px 14px;border-radius:var(--radius);border:1px solid var(--gray-100)}
.meta-label{font-size:11px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.meta-value{font-size:14px;font-weight:600;color:var(--gray-800);word-break:break-word}
.meta-value.big{font-size:18px;font-weight:800}
.case-types{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.badge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.badge-r{background:var(--success-light);color:var(--success)}
.badge-b{background:var(--danger-light);color:var(--danger)}
.badge-urgent{background:var(--danger-light);color:var(--danger)}
.badge-pending{background:var(--warning-light);color:var(--warning)}
.badge-hold{background:var(--purple-light);color:var(--purple)}
.badge-case{background:var(--gray-100);color:var(--gray-700);font-size:12px;padding:4px 10px;border-radius:6px;font-weight:600}
.task-remarks{background:var(--gray-50);padding:14px 16px;border-radius:var(--radius);border-left:4px solid var(--primary);margin-bottom:14px;font-size:14px;color:var(--gray-700);line-height:1.5}
.task-remarks b{color:var(--gray-900);font-weight:700;margin-right:6px}
.hold-reason-box{background:var(--purple-light);padding:14px 16px;border-radius:var(--radius);border-left:4px solid var(--purple);margin-bottom:14px;font-size:14px;color:#5b21b6;line-height:1.5}
.hold-reason-box b{color:#4c1d95;font-weight:700;margin-right:6px}
.task-actions{display:flex;justify-content:flex-end;gap:10px;align-items:center;padding-top:14px;border-top:1px solid var(--gray-100);flex-wrap:wrap}
.empty-state{text-align:center;padding:40px 20px;color:var(--gray-500)}
.tablewrap{overflow:auto;border-radius:var(--radius);border:1px solid var(--gray-200)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--gray-200);vertical-align:top}
th{background:var(--gray-50);font-weight:700;color:var(--gray-600);font-size:12px;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;z-index:2;white-space:nowrap}
tbody tr:hover{background:var(--gray-50)}
tbody tr:last-child td{border-bottom:none}

#newTaskOverlay{position:fixed;inset:0;background:rgba(15,23,42,.75);backdrop-filter:blur(6px);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#newTaskBox{background:#fff;width:min(400px,92vw);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-xl);animation:slideUp .3s;text-align:center}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
#newTaskBox.urgent-popup{border-top:6px solid var(--danger)}
#newTaskBox.normal-popup{border-top:6px solid var(--primary)}
.popup-priority{text-align:center;margin-bottom:12px}
.popup-priority .badge{font-size:14px;padding:6px 16px}
.popup-priority .badge.flash{animation:flash 1s infinite}
@keyframes flash{50%{opacity:.45}}
.popup-title{font-size:18px;font-weight:700;color:var(--gray-900);text-align:center;margin-bottom:16px}
.popup-one-liner{font-size:14px;color:var(--gray-700);margin-bottom:20px;line-height:1.5;background:var(--gray-50);padding:12px 16px;border-radius:var(--radius);border:1px solid var(--gray-200);text-align:left}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#fff;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#holdReasonOverlay, #deleteReasonOverlay, #forgotPasswordOverlay{position:fixed;inset:0;background:rgba(15,23,42,.78);backdrop-filter:blur(6px);z-index:100000;display:flex;align-items:center;justify-content:center;padding:20px}
#holdReasonBox, #deleteReasonBox{background:#fff;width:min(620px,96vw);border-radius:var(--radius-lg);padding:30px;box-shadow:var(--shadow-xl)}
#holdReasonBox h3, #deleteReasonBox h3{font-size:22px;margin-bottom:8px}
#holdReasonBox p, #deleteReasonBox p{color:var(--gray-500);font-size:13px;margin-bottom:16px}
#holdReasonSelect, #deleteReasonSelect{width:100%;padding:14px 16px;border:1px solid var(--gray-300);border-radius:var(--radius);font:600 14px Inter,system-ui,sans-serif;background:#fff;color:var(--gray-800);margin-bottom:20px}
#holdReasonSelect:focus, #deleteReasonSelect:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(124,58,237,.12)}
.hold-modal-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}

#forgotPasswordBox{background:#fff;width:min(520px,96vw);max-height:94vh;overflow:auto;border-radius:var(--radius-lg);padding:32px;box-shadow:var(--shadow-xl)}
.forgot-header{text-align:center;margin-bottom:24px}
.forgot-header h2{margin-bottom:6px}
.forgot-header p{color:var(--gray-500);font-size:13px}
.forgot-field{margin-bottom:16px}
.forgot-field label{display:block;font-size:13px;font-weight:700;color:var(--gray-600);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.forgot-field input, .forgot-field select{width:100%;padding:13px 16px;border:1px solid var(--gray-300);border-radius:var(--radius);font-size:15px;font-family:inherit;background:#fff;color:var(--gray-800)}
.forgot-field input:focus, .forgot-field select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.forgot-actions{display:flex;gap:10px;margin-top:18px}
.forgot-actions button{flex:1}
.forgot-link{margin-top:18px;padding-top:16px;border-top:1px solid var(--gray-200
